<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="96" y1="128" x2="416" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00EAFF"/>
      <stop offset="55%" stop-color="#3F86FF"/>
      <stop offset="100%" stop-color="#8B5CFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
