        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <path d="M96 176 C 150 120, 214 120, 262 176 S 374 232, 416 176"
          stroke="url(#waveGradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 256 C 150 200, 214 200, 262 256 S 374 312, 416 256"
